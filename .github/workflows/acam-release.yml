name: ACAM Cross-Platform Headless CLI Release

on:
  push:
    tags:
      - 'v*-acam*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (leave empty to build artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux x86_64 (headless-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run headless-cli unit tests
        env:
          UU_NO_X11: "1"
          UU_NO_GTK: "1"
        run: cargo test --bin uuremote-viewer --features headless-cli
      - name: Build uuremote-viewer (Linux x86_64 headless-cli)
        env:
          UU_NO_X11: "1"
          UU_NO_GTK: "1"
        run: |
          cargo build --release --bin uuremote-viewer --features headless-cli
          mkdir -p dist
          cp target/release/uuremote-viewer dist/uuremote-viewer-linux-x86_64
          ldd dist/uuremote-viewer-linux-x86_64
          if ldd dist/uuremote-viewer-linux-x86_64 | grep -iE 'libX11|libgtk|libSDL2'; then
            echo "Unexpected GUI shared library dependency!" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/uuremote-viewer-linux-x86_64

  build-windows:
    name: Build Windows x86_64 (headless-cli)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build uuremote-viewer (Windows x86_64 headless-cli)
        shell: pwsh
        run: |
          cargo build --release --bin uuremote-viewer --features headless-cli
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\uuremote-viewer.exe dist\uuremote-viewer-windows-x86_64.exe
          .\dist\uuremote-viewer-windows-x86_64.exe --help | Select-Object -First 5
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/uuremote-viewer-windows-x86_64.exe

  build-macos:
    name: Build macOS arm64 + x86_64 (headless-cli)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build uuremote-viewer (macOS arm64 & x86_64 headless-cli)
        run: |
          mkdir -p dist
          cargo build --release --target aarch64-apple-darwin --bin uuremote-viewer --features headless-cli
          cp target/aarch64-apple-darwin/release/uuremote-viewer dist/uuremote-viewer-macos-aarch64
          cargo build --release --target x86_64-apple-darwin --bin uuremote-viewer --features headless-cli
          cp target/x86_64-apple-darwin/release/uuremote-viewer dist/uuremote-viewer-macos-x86_64
          file dist/uuremote-viewer-macos-*
          ./dist/uuremote-viewer-macos-aarch64 --help | head -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/uuremote-viewer-macos-*

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          chmod +x uuremote-viewer-linux-x86_64 uuremote-viewer-macos-aarch64 uuremote-viewer-macos-x86_64
          sha256sum uuremote-viewer-* > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" artifacts/* --clobber
          else
            gh release create "$REL_TAG" artifacts/* \
              --title "$REL_TAG (Linux / Windows / macOS Headless CLI)" \
              --notes "Automated cross-platform headless CLI build for Linux x86_64, Windows x86_64, macOS arm64, and macOS x86_64. Includes 4-layer anti-overlay ICE filter, full-duplex portmap/--stdio, and standalone QR login."
          fi
